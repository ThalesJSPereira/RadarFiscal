name: Monitor NFe/CTe/MDFe

on:
  schedule:
    # Roda às 09:00 e às 15:00 (horário de Brasília = UTC-3 -> 12:00 e 18:00 UTC)
    - cron: "0 12,18 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions"
  push:
    branches: [ "main" ]
    paths:
      - "scraper/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write   # necessário para o job poder commitar data/state.json e docs/data.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar monitor
        id: run_monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m scraper.main

      - name: Commitar dados atualizados
        if: always()
        run: |
          git config user.name "radar-fiscal-bot"
          git config user.email "radar-fiscal-bot@users.noreply.github.com"
          git add data/state.json docs/data.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore(monitor): atualiza dados - novos=${{ steps.run_monitor.outputs.new_count }} novas_versoes=${{ steps.run_monitor.outputs.updated_count }}"
            git push
          fi
